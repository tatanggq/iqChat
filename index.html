<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iqChatr</title>
    
    <!-- PWA MANIFEST & META -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E54">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --wa-green: #25D366;
            --wa-dark-green: #075E54;
            --wa-light-green: #dcf8c6;
            --wa-bg: #efeae2;
            --panel-bg: #ffffff;
            --text-main: #111b21;
            --text-secondary: #667781;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .app-window { width: 100%; max-width: 480px; height: 100vh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        @media(min-width: 481px) { .app-window { height: 92vh; border-radius: 16px; border: 1px solid #334155; } }

        .view-panel { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; inset: 0; background: var(--panel-bg); }
        .view-panel.active { display: flex; }

        /* HEADER STYLING */
        .app-header { background: var(--wa-dark-green); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .header-title { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }

        /* CONTACT LIST STYLING */
        .search-bar-container { padding: 8px 12px; background: #f0f2f5; border-bottom: 1px solid #e9edef; }
        .search-box { width: 100%; padding: 8px 14px; background: #fff; border: none; border-radius: 20px; outline: none; font-size: 13px; }
        
        .contact-list { flex: 1; overflow-y: auto; background: #fff; }
        .contact-item { padding: 12px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border-bottom: 1px solid #f0f2f5; transition: background 0.2s; }
        .contact-item:hover { background: #f5f6f6; }
        .contact-item:active { background: #e9edef; }
        
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #075E54; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: bold; font-size: 15px; color: var(--text-main); margin-bottom: 3px; }
        .contact-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* CHAT ROOM STYLING */
        .chat-room-panel { background: var(--wa-bg); background-image: radial-gradient(#0000000d 1px, transparent 1px); background-size: 24px 24px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 7.5px; font-size: 13.5px; position: relative; word-break: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); line-height: 1.4; }
        .incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; color: #111; }
        .incoming::before { content: ""; position: absolute; top: 0; left: -8px; width: 0; height: 0; border: 8px solid transparent; border-top-color: #ffffff; border-left: 0; border-right: 0; }

        .outgoing { background: var(--wa-light-green); align-self: flex-end; border-top-right-radius: 0; color: #111; }
        .outgoing::after { content: ""; position: absolute; top: 0; right: -8px; width: 0; height: 0; border: 8px solid transparent; border-top-color: var(--wa-light-green); border-right: 0; border-left: 0; }

        .bubble-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 3px; display: flex; justify-content: flex-end; align-items: center; gap: 3px; }

        /* INPUT AREA */
        .chat-input-area { background: #f0f2f5; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #e9edef; }
        .chat-input-box { flex: 1; padding: 10px 16px; border: none; border-radius: 24px; outline: none; font-size: 14px; background: #fff; color: #111; }
        .btn-icon { background: none; border: none; color: #54656f; font-size: 20px; cursor: pointer; padding: 4px; }

        /* OVERLAY / MODALS */
        .overlay-screen { position: absolute; inset: 0; background: #111b21; color: white; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .form-input { width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-top: 12px; text-align: center; outline: none; }
        .btn-green { width: 100%; max-width: 320px; padding: 12px; background: var(--wa-green); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-green:hover { background: #20ba5a; }

        .btn-pwa-install { background: #0288d1; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN (SIMULASI OTP WHATSAPP AKTIF) -->
    <div id="loginModal" class="overlay-screen">
        <i class="fa-brands fa-whatsapp" style="font-size: 68px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2 style="font-size: 22px; font-weight: 600;">iqChat Web Messenger</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px; max-width: 300px;">Masukkan nomor WhatsApp aktif Anda untuk memulai sesi aman multi-device.</p>
        <input type="tel" id="inputPhone" class="form-input" placeholder="Contoh: 628123456789">
        <button class="btn-green" onclick="requestOtpCode()">Kirim Kode Verifikasi OTP</button>
    </div>

    <!-- 2. OTP VERIFICATION SCREEN -->
    <div id="otpModal" class="overlay-screen" style="display:none;">
        <i class="fa-solid fa-shield-halved" style="font-size: 58px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2 style="font-size: 22px;">Konfirmasi OTP WhatsApp</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px;">Kode verifikasi simulasi dikirim ke WA Anda: <b style="color:var(--wa-green);">8888</b></p>
        <input type="text" id="inputOtp" class="form-input" placeholder="Masukkan 4 digit OTP" maxlength="4" style="letter-spacing: 4px; font-weight: bold;">
        <button class="btn-green" onclick="verifyOtpCode()">Verifikasi & Masuk</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-window">

        <!-- VIEW A: DAFTAR KONTAK & CHAT -->
        <div id="viewContactList" class="view-panel active">
            <div class="app-header">
                <div class="header-title"><i class="fa-solid fa-comments"></i> iqChat</div>
                <div class="header-actions">
                    <button id="btnInstall" class="btn-pwa-install" onclick="triggerPwaInstall()">
                        <i class="fa-solid fa-download"></i> Install App
                    </button>
                    <span id="myPhoneBadge" style="font-size: 11px; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; font-weight: 500;">-</span>
                </div>
            </div>
            
            <div class="search-bar-container">
                <input type="text" class="search-box" placeholder="Cari atau mulai chat baru..." id="searchContactInput" oninput="filterContacts(this.value)">
            </div>

            <div style="padding: 10px 14px; background: #fff; border-bottom: 1px solid #f0f2f5;">
                <button onclick="addNewContactPrompt()" style="width:100%; padding:10px; background:var(--wa-dark-green); color:white; border:none; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <i class="fa-solid fa-user-plus"></i> Tambah Kontak & Mulai Chat Baru
                </button>
            </div>

            <div class="contact-list" id="contactListContainer"></div>
        </div>

        <!-- VIEW B: RUANG CHAT UTAMA -->
        <div id="viewChatRoom" class="view-panel chat-room-panel">
            <div class="app-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="backToContactList()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer; padding:4px;"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 14px;">T</div>
                    <div>
                        <div id="activeName" style="font-weight: bold; font-size: 14px;">Kontak</div>
                        <div id="cloudStatusLabel" style="font-size: 10.5px; color: #dcf8c6;">Online (Cloud Synced)</div>
                    </div>
                </div>
                <div class="header-actions" style="gap: 16px;">
                    <button class="btn-icon" onclick="startVoiceCall()" style="color:white;"><i class="fa-solid fa-phone"></i></button>
                    <button class="btn-icon" onclick="startVideoCall()" style="color:white;"><i class="fa-solid fa-video"></i></button>
                </div>
            </div>

            <!-- CHAT BUBBLES AREA -->
            <div class="chat-messages" id="chatMessagesArea"></div>

            <!-- INPUT BAR -->
            <div class="chat-input-area">
                <button class="btn-icon" onclick="alert('Fitur lampiran file/media aktif.')"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="messageInput" class="chat-input-box" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
                <button onclick="sendChatMessage()" style="background:var(--wa-green); border:none; width:42px; height:42px; border-radius:50%; color:#111; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script>
        // INISIALISASI FIREBASE CLOUD REALTIME DATABASE
        const firebaseConfig = {
            databaseURL: "https://iqdriver-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentUser = localStorage.getItem('iq_user_phone') || "";
        let activeTarget = localStorage.getItem('iq_active_target') || "";
        let contacts = JSON.parse(localStorage.getItem('iq_contacts') || '["628997032209", "6285934602965"]');

        let deferredPrompt;
        const installBtn = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
        });

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        // SIMULASI PERMINTAAN & VERIFIKASI OTP
        function requestOtpCode() {
            const phone = document.getElementById('inputPhone').value.trim();
            if(!phone || phone.length < 10) {
                alert("Masukkan nomor WhatsApp yang valid (awali dengan 62 atau 08)!");
                return;
            }
            localStorage.setItem('temp_phone', phone);
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('otpModal').style.display = 'flex';
        }

        function verifyOtpCode() {
            const otp = document.getElementById('inputOtp').value.trim();
            if(otp === "8888") {
                currentUser = localStorage.getItem('temp_phone');
                localStorage.setItem('iq_user_phone', currentUser);
                document.getElementById('otpModal').style.display = 'none';
                initAppSession();
            } else {
                alert("Kode OTP salah! Gunakan kode simulasi: 8888");
            }
        }

        function initAppSession() {
            document.getElementById('myPhoneBadge').innerText = "+" + currentUser;
            renderContactList();
        }

        // RENDER DAFTAR KONTAK
        function renderContactList(filterText = "") {
            const container = document.getElementById('contactListContainer');
            container.innerHTML = "";
            
            const filtered = contacts.filter(num => num.includes(filterText));
            
            if(filtered.length === 0) {
                container.innerHTML = `<div style="padding:20px; text-align:center; color:#667781; font-size:13px;">Tidak ada kontak ditemukan.</div>`;
                return;
            }

            filtered.forEach(num => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => openChatRoom(num);
                div.innerHTML = `
                    <div class="avatar">${num.substring(num.length - 2)}</div>
                    <div class="contact-info">
                        <div class="contact-name">+${num}</div>
                        <div class="contact-preview">Ketuk untuk membuka percakapan real-time</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterContacts(val) {
            renderContactList(val.trim());
        }

        function addNewContactPrompt() {
            let newNum = prompt("Masukkan Nomor WhatsApp Tujuan (Contoh: 628xxxxxxxxxx):");
            if(newNum) {
                newNum = newNum.replace(/\D/g,'');
                if(newNum.length >= 10 && !contacts.includes(newNum)) {
                    contacts.push(newNum);
                    localStorage.setItem('iq_contacts', JSON.stringify(contacts));
                    openChatRoom(newNum);
                } else if(contacts.includes(newNum)) {
                    openChatRoom(newNum);
                } else {
                    alert("Nomor tidak valid!");
                }
            }
        }

        function openChatRoom(num) {
            activeTarget = num;
            localStorage.setItem('iq_active_target', activeTarget);
            document.getElementById('activeName').innerText = "+" + activeTarget;
            document.getElementById('activeAvatar').innerText = activeTarget.substring(activeTarget.length - 2);
            
            document.getElementById('viewContactList').classList.remove('active');
            document.getElementById('viewChatRoom').classList.add('active');
            
            listenToRealtimeMessages();
        }

        function backToContactList() {
            document.getElementById('viewChatRoom').classList.remove('active');
            document.getElementById('viewContactList').classList.add('active');
            renderContactList();
        }

        // KIRIM PESAN REAL-TIME KE FIREBASE CLOUD
        function sendChatMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text || !activeTarget) return;

            // Buat Room ID unik konsisten berdasarkan kombinasi kedua nomor
            const sortedNumbers = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort();
            const chatRoomId = sortedNumbers.join('_');

            const messageData = {
                sender: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            db.ref('iqchat_rooms/' + chatRoomId).push(messageData, (error) => {
                if (error) {
                    alert("Gagal mengirim pesan: " + error.message);
                } else {
                    input.value = "";
                }
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        // SINKRONISASI REAL-TIME ANTAR DEVICE & NOMOR BERBEDA
        function listenToRealtimeMessages() {
            if(!activeTarget) return;
            const sortedNumbers = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort();
            const chatRoomId = sortedNumbers.join('_');
            const area = document.getElementById('chatMessagesArea');
            const statusLabel = document.getElementById('cloudStatusLabel');

            statusLabel.innerText = "Sinkronisasi Cloud...";

            db.ref('iqchat_rooms/' + chatRoomId).on('value', (snapshot) => {
                statusLabel.innerText = "Online (Cloud Synced)";
                area.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.values(data).forEach(msg => {
                        const isMe = msg.sender === currentUser;
                        const bubble = document.createElement('div');
                        bubble.className = `bubble ${isMe ? 'outgoing' : 'incoming'}`;
                        bubble.innerHTML = `
                            <div>${msg.text}</div>
                            <div class="bubble-meta">
                                ${msg.time} 
                                ${isMe ? '<i class="fa-solid fa-check-double" style="color:#53bdeb; margin-left:2px;"></i>' : ''}
                            </div>
                        `;
                        area.appendChild(bubble);
                    });
                    area.scrollTop = area.scrollHeight;
                }
            }, (error) => {
                statusLabel.innerText = "Koneksi Cloud Terputus!";
                console.error("Firebase read error:", error);
            });
        }

        function startVoiceCall() { alert(`Memulai Panggilan Suara terenkripsi dengan +${activeTarget}...`); }
        function startVideoCall() { alert(`Memulai Video Call dengan +${activeTarget}...`); }

        // INISIALISASI SAAT HALAMAN DIBUKA
        window.onload = function() {
            if (!currentUser) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                document.getElementById('loginModal').style.display = 'none';
                initAppSession();
            }

            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
                installBtn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
