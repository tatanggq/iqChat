<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iqChat - Cloud Realtime Messenger</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E54">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --wa-green: #25D366;
            --wa-dark-green: #075E54;
            --wa-light-green: #dcf8c6;
            --wa-bg: #efeae2;
            --panel-bg: #ffffff;
            --text-main: #111b21;
            --text-secondary: #667781;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .app-window { width: 100%; max-width: 480px; height: 100vh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        @media(min-width: 481px) { .app-window { height: 92vh; border-radius: 16px; border: 1px solid #334155; } }

        .view-panel { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; inset: 0; background: var(--panel-bg); }
        .view-panel.active { display: flex; }

        .app-header { background: var(--wa-dark-green); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header-title { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .search-bar-container { padding: 8px 12px; background: #f0f2f5; border-bottom: 1px solid #e9edef; }
        .search-box { width: 100%; padding: 8px 14px; background: #fff; border: none; border-radius: 20px; outline: none; font-size: 13px; }
        
        .contact-list { flex: 1; overflow-y: auto; background: #fff; }
        .contact-item { padding: 12px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border-bottom: 1px solid #f0f2f5; }
        .contact-item:hover { background: #f5f6f6; }
        
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #075E54; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: bold; font-size: 15px; color: var(--text-main); margin-bottom: 3px; }
        .contact-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-room-panel { background: var(--wa-bg); background-image: radial-gradient(#0000000d 1px, transparent 1px); background-size: 24px 24px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 7.5px; font-size: 13.5px; position: relative; word-break: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); line-height: 1.4; }
        .incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; color: #111; }
        .outgoing { background: var(--wa-light-green); align-self: flex-end; border-top-right-radius: 0; color: #111; }
        .bubble-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 3px; display: flex; justify-content: flex-end; align-items: center; gap: 3px; }

        .chat-input-area { background: #f0f2f5; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #e9edef; }
        .chat-input-box { flex: 1; padding: 10px 16px; border: none; border-radius: 24px; outline: none; font-size: 14px; background: #fff; color: #111; }
        .btn-icon { background: none; border: none; color: #54656f; font-size: 18px; cursor: pointer; padding: 6px; }

        .overlay-screen { position: absolute; inset: 0; background: #111b21; color: white; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .form-input { width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-top: 12px; text-align: center; outline: none; }
        .btn-green { width: 100%; max-width: 320px; padding: 12px; background: var(--wa-green); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 16px; cursor: pointer; }
        
        .btn-pwa-install { background: #0288d1; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-logout { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginModal" class="overlay-screen">
        <i class="fa-brands fa-whatsapp" style="font-size: 68px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2 style="font-size: 22px; font-weight: 600;">iqChat Web Messenger</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px;">Masukkan nomor WhatsApp aktif Anda.</p>
        <input type="tel" id="inputPhone" class="form-input" placeholder="Contoh: 628123456789">
        <button class="btn-green" onclick="requestOtpCode()">Kirim Kode Verifikasi OTP</button>
    </div>

    <!-- OTP SCREEN -->
    <div id="otpModal" class="overlay-screen" style="display:none;">
        <i class="fa-solid fa-shield-halved" style="font-size: 58px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2 style="font-size: 22px;">Konfirmasi OTP WhatsApp</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px;">Kode verifikasi simulasi: <b style="color:var(--wa-green);">8888</b></p>
        <input type="text" id="inputOtp" class="form-input" placeholder="4 digit OTP" maxlength="4" style="letter-spacing: 4px; font-weight: bold;">
        <button class="btn-green" onclick="verifyOtpCode()">Verifikasi & Masuk</button>
    </div>

    <!-- MAIN APP -->
    <div class="app-window">
        <div id="viewContactList" class="view-panel active">
            <div class="app-header">
                <div class="header-title"><i class="fa-solid fa-comments"></i> iqChat</div>
                <div class="header-actions">
                    <button id="btnInstall" class="btn-pwa-install" onclick="triggerPwaInstall()"><i class="fa-solid fa-download"></i> Install</button>
                    <button class="btn-logout" onclick="logoutSession()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
                </div>
            </div>
            
            <div style="background:#115e59; color:white; padding:6px 14px; font-size:11px; display:flex; justify-content:space-between; align-items:center;">
                <span>Akun: <b id="myPhoneBadge">-</b></span>
                <span id="connectionStatusBadge" style="color:#a7f3d0;">Cloud Connected</span>
            </div>

            <div class="search-bar-container">
                <input type="text" class="search-box" placeholder="Cari kontak..." oninput="filterContacts(this.value)">
            </div>

            <div style="padding: 10px 14px; background: #fff; border-bottom: 1px solid #f0f2f5;">
                <button onclick="addNewContactPrompt()" style="width:100%; padding:10px; background:var(--wa-dark-green); color:white; border:none; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer;">
                    <i class="fa-solid fa-user-plus"></i> + Mulai Chat Nomor Baru
                </button>
            </div>

            <div class="contact-list" id="contactListContainer"></div>
        </div>

        <!-- CHAT ROOM -->
        <div id="viewChatRoom" class="view-panel chat-room-panel">
            <div class="app-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="backToContactList()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 14px;">T</div>
                    <div>
                        <div id="activeName" style="font-weight: bold; font-size: 14px;">Kontak</div>
                        <div id="cloudStatusLabel" style="font-size: 10.5px; color: #dcf8c6;">Realtime Cloud Sync</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" onclick="startVoiceCall()" style="color:white;"><i class="fa-solid fa-phone"></i></button>
                    <button class="btn-icon" onclick="startVideoCall()" style="color:white;"><i class="fa-solid fa-video"></i></button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessagesArea"></div>

            <!-- INPUT BAR & FILE UPLOAD -->
            <div class="chat-input-area">
                <input type="file" id="fileInput" style="display:none" onchange="handleFileSelected(this)">
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="messageInput" class="chat-input-box" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
                <button onclick="sendChatMessage()" style="background:var(--wa-green); border:none; width:42px; height:42px; border-radius:50%; color:#111; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // INISIALISASI FIREBASE CLOUD REALTIME DATABASE (JALUR PUBLIK TERBUKA)
        const firebaseConfig = {
            databaseURL: "https://iqdriver-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentUser = localStorage.getItem('iq_user_phone') || "";
        let activeTarget = localStorage.getItem('iq_active_target') || "";
        let contacts = JSON.parse(localStorage.getItem('iq_contacts') || '["628997032209", "6285934602965"]');

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstall').style.display = 'inline-flex';
        });

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            } else {
                alert("Aplikasi sudah siap atau sudah terinstal.");
            }
        }

        function requestOtpCode() {
            const phone = document.getElementById('inputPhone').value.trim();
            if(!phone || phone.length < 10) { alert("Masukkan nomor valid!"); return; }
            localStorage.setItem('temp_phone', phone.replace(/\D/g,''));
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('otpModal').style.display = 'flex';
        }

        function verifyOtpCode() {
            const otp = document.getElementById('inputOtp').value.trim();
            if(otp === "8888") {
                currentUser = localStorage.getItem('temp_phone');
                localStorage.setItem('iq_user_phone', currentUser);
                document.getElementById('otpModal').style.display = 'none';
                initAppSession();
            } else { alert("OTP Salah! Gunakan: 8888"); }
        }

        function logoutSession() {
            if(confirm("Keluar akun?")) { localStorage.removeItem('iq_user_phone'); location.reload(); }
        }

        function initAppSession() {
            document.getElementById('myPhoneBadge').innerText = "+" + currentUser;
            renderContactList();
        }

        function renderContactList(filter = "") {
            const container = document.getElementById('contactListContainer');
            container.innerHTML = "";
            contacts.filter(n => n.includes(filter)).forEach(num => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => openChatRoom(num);
                div.innerHTML = `<div class="avatar">${num.slice(-2)}</div><div class="contact-info"><div class="contact-name">+${num}</div><div class="contact-preview">Ketuk untuk chat</div></div>`;
                container.appendChild(div);
            });
        }

        function filterContacts(val) { renderContactList(val.trim()); }

        function addNewContactPrompt() {
            let num = prompt("Nomor WhatsApp Tujuan (628...):");
            if(num) {
                num = num.replace(/\D/g,'');
                if(!contacts.includes(num)) { contacts.push(num); localStorage.setItem('iq_contacts', JSON.stringify(contacts)); }
                openChatRoom(num);
            }
        }

        function openChatRoom(num) {
            activeTarget = num;
            localStorage.setItem('iq_active_target', activeTarget);
            document.getElementById('activeName').innerText = "+" + activeTarget;
            document.getElementById('activeAvatar').innerText = activeTarget.slice(-2);
            document.getElementById('viewContactList').classList.remove('active');
            document.getElementById('viewChatRoom').classList.add('active');
            listenToRealtimeCloud();
        }

        function backToContactList() {
            document.getElementById('viewChatRoom').classList.remove('active');
            document.getElementById('viewContactList').classList.add('active');
            renderContactList();
        }

        // FUNGSI KIRIM PESAN & MEDIA KE FIREBASE CLOUD (SINKRONISASI NYATA ANTAR DEVICE)
        function sendChatMessage(customContent = null, type = 'text') {
            const input = document.getElementById('messageInput');
            const content = customContent || input.value.trim();
            if(!content || !activeTarget) return;

            const roomKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
            const msgObj = {
                sender: currentUser,
                content: content,
                type: type, // 'text', 'image', 'file'
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };

            // Kirim langsung ke Firebase Cloud agar perangkat lain menerima secara real-time
            db.ref('iqchat_rooms_sync/' + roomKey).push(msgObj, (error) => {
                if(error) {
                    alert("Gagal sinkronisasi cloud: " + error.message);
                } else {
                    if(!customContent) input.value = "";
                }
            });
        }

        function handleFileSelected(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const fileData = {
                        name: file.name,
                        data: e.target.result,
                        size: (file.size / 1024).toFixed(1) + ' KB'
                    };
                    if(file.type.startsWith('image/')) {
                        sendChatMessage(fileData, 'image');
                    } else {
                        sendChatMessage(fileData, 'file');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // MENDENGARKAN PERUBAHAN PESAN DARI CLOUD SECARA REAL-TIME DI SEMUA DEVICE
        function listenToRealtimeCloud() {
            if(!activeTarget) return;
            const roomKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
            const area = document.getElementById('chatMessagesArea');
            const statusLabel = document.getElementById('cloudStatusLabel');

            statusLabel.innerText = "Menghubungkan ke Cloud...";

            db.ref('iqchat_rooms_sync/' + roomKey).on('value', (snapshot) => {
                statusLabel.innerText = "Realtime Cloud Sync Aktif";
                area.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.values(data).forEach(msg => {
                        const isMe = msg.sender === currentUser;
                        const bubble = document.createElement('div');
                        bubble.className = `bubble ${isMe ? 'outgoing' : 'incoming'}`;
                        
                        let bodyHtml = "";
                        if(msg.type === 'image') {
                            bodyHtml = `<img src="${msg.content.data}" style="max-width:100%; border-radius:6px; margin-bottom:4px;"><div style="font-size:11px;">📷 ${msg.content.name} (${msg.content.size})</div>`;
                        } else if(msg.type === 'file') {
                            bodyHtml = `<div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.05); padding:8px; border-radius:6px;"><i class="fa-solid fa-file-pdf" style="font-size:24px; color:#c5221f;"></i><div style="overflow:hidden;"><div style="font-weight:bold; font-size:12px; white-space:nowrap; text-overflow:ellipsis;">${msg.content.name}</div><div style="font-size:10px; color:#666;">${msg.content.size}</div></div></div>`;
                        } else {
                            bodyHtml = `<div>${msg.content}</div>`;
                        }

                        bubble.innerHTML = `${bodyHtml}<div class="bubble-meta">${msg.time} ${isMe ? '<i class="fa-solid fa-check-double" style="color:#53bdeb;"></i>' : ''}</div>`;
                        area.appendChild(bubble);
                    });
                    area.scrollTop = area.scrollHeight;
                }
            }, (error) => {
                statusLabel.innerText = "Koneksi Cloud Gagal!";
                console.error(error);
            });
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendChatMessage(); }
        function startVoiceCall() { alert(`Memulai Panggilan Suara dengan +${activeTarget}`); }
        function startVideoCall() { alert(`Memulai Video Call dengan +${activeTarget}`); }

        window.onload = function() {
            if(!currentUser) { document.getElementById('loginModal').style.display = 'flex'; }
            else { document.getElementById('loginModal').style.display = 'none'; initAppSession(); }
        }
    </script>
</body>
</html>
