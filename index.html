<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>iqChat</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E54">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --wa-green: #25D366;
            --wa-dark-green: #075E54;
            --wa-light-green: #dcf8c6;
            --wa-bg: #efeae2;
            --panel-bg: #ffffff;
            --text-main: #111b21;
            --text-secondary: #667781;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* FULL 100% TANPA BLACK SPOT DI SEMUA HP */
        html, body { width: 100%; height: 100%; background-color: var(--wa-bg); overflow: hidden; position: fixed; inset: 0; }

        .app-window { width: 100%; height: 100%; background: var(--wa-bg); display: flex; flex-direction: column; position: absolute; inset: 0; overflow: hidden; z-index: 5; }

        .view-panel { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; inset: 0; background: var(--panel-bg); }
        .view-panel.active { display: flex; }

        .app-header { background: var(--wa-dark-green); color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; }
        .header-title { font-weight: bold; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .search-bar-container { padding: 8px 12px; background: #f0f2f5; border-bottom: 1px solid #e9edef; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .search-box { flex: 1; padding: 8px 14px; background: #fff; border: none; border-radius: 20px; outline: none; font-size: 13px; }
        
        .contact-list { flex: 1; overflow-y: auto; background: #fff; -webkit-overflow-scrolling: touch; }
        .contact-item { padding: 12px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border-bottom: 1px solid #f0f2f5; position: relative; user-select: none; }
        .contact-item:hover { background: #f5f6f6; }
        
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #075E54; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; position: relative; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: bold; font-size: 15px; color: var(--text-main); margin-bottom: 3px; display: flex; justify-content: space-between; }
        .contact-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: #25D366; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 50%; }

        .chat-room-panel { background: var(--wa-bg); background-image: radial-gradient(#0000000d 1px, transparent 1px); background-size: 24px 24px; display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
        
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 7.5px; font-size: 13.5px; position: relative; word-break: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); line-height: 1.4; }
        .incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; color: #111; }
        .outgoing { background: var(--wa-light-green); align-self: flex-end; border-top-right-radius: 0; color: #111; }
        .bubble-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 3px; display: flex; justify-content: flex-end; align-items: center; gap: 3px; }

        /* INPUT AREA DI ATAS KEYBOARD */
        .chat-input-area { background: #f0f2f5; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #e9edef; flex-shrink: 0; width: 100%; }
        .chat-input-box { flex: 1; padding: 10px 16px; border: none; border-radius: 24px; outline: none; font-size: 14px; background: #fff; color: #111; }
        .btn-icon { background: none; border: none; color: #54656f; font-size: 18px; cursor: pointer; padding: 6px; }

        /* CHAT HEAD BUBBLE */
        .chat-head-bubble { position: fixed; bottom: 80px; right: 25px; width: 60px; height: 60px; background: #0084ff; border-radius: 50%; display: none; align-items: center; justify-content: center; color: white; box-shadow: 0 6px 25px rgba(0,0,0,0.5); cursor: pointer; z-index: 99999; background-size: cover; background-position: center; border: 3px solid white; touch-action: none; }
        .chat-head-unread { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; background: #25D366; border-radius: 50%; border: 2px solid white; display: none; }

        #dropZoneX { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; background: rgba(0,0,0,0.7); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 20px; z-index: 99998; border: 2px dashed #fff; }

        #incomingPopup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: #202c33; color: white; padding: 14px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); z-index: 100000; display: none; align-items: center; gap: 12px; cursor: pointer; border-left: 5px solid var(--wa-green); }

        #videoCallModal { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000000; z-index: 999999; display: none; flex-direction: column; justify-content: space-between; }

        .overlay-screen { position: absolute; inset: 0; background: #111b21; color: white; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .form-input { width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-top: 12px; text-align: center; outline: none; }
        .btn-green { width: 100%; max-width: 320px; padding: 12px; background: var(--wa-green); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 16px; cursor: pointer; }
        
        .btn-pwa-install { background: #0288d1; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-logout { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

    <!-- POPUP PESAN MASUK -->
    <div id="incomingPopup" onclick="openChatFromPopup()">
        <div class="avatar" id="popupAvatar" style="width: 42px; height: 42px;">U</div>
        <div style="flex: 1; min-width: 0;">
            <div id="popupSenderName" style="font-weight: bold; font-size: 14px; color: var(--wa-green);">Pesan Baru</div>
            <div id="popupMessageText" style="font-size: 12.5px; color: #e9edef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Isi pesan...</div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #8696a0; font-size: 14px;"></i>
    </div>

    <!-- CHAT HEAD BUBBLE -->
    <div id="chatHead" class="chat-head-bubble" title="Geser ke X untuk menutup">
        <div id="chatHeadUnread" class="chat-head-unread"></div>
    </div>
    <div id="dropZoneX"><i class="fa-solid fa-xmark"></i></div>

    <!-- VIDEO CALL MODAL -->
    <div id="videoCallModal">
        <div style="position: absolute; top: 20px; left: 0; right: 0; text-align: center; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px;">
            <h3 id="videoCallTitle" style="font-size: 18px; color: #fff;">Video Call</h3>
            <p id="videoCallStatus" style="font-size: 12px; color: #00ffcc; margin-top: 2px;">Menghubungkan...</p>
        </div>
        
        <div style="width: 100vw; height: 100vh; position: absolute; inset: 0; background: #111;">
            <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>

        <div onclick="switchVideoView()" style="position: absolute; top: 80px; right: 20px; width: 110px; height: 160px; background: #222; border-radius: 12px; overflow: hidden; border: 2px solid #fff; z-index: 15; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <video id="localVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>

        <div style="position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; z-index: 20;">
            <button onclick="answerIncomingCall()" id="btnAnswerCall" style="background: #25d366; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 24px; cursor: pointer; display:none;"><i class="fa-solid fa-phone"></i></button>
            <button onclick="endVideoCall()" style="background: #ef4444; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 24px; cursor: pointer;"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginModal" class="overlay-screen">
        <i class="fa-brands fa-whatsapp" style="font-size: 68px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2>iqChat Web Messenger</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px;">Masukkan nomor WhatsApp aktif Anda.</p>
        <input type="tel" id="inputPhone" class="form-input" placeholder="Contoh: 628123456789">
        <button class="btn-green" onclick="requestOtpCode()">Kirim Kode Verifikasi OTP</button>
    </div>

    <!-- OTP SCREEN -->
    <div id="otpModal" class="overlay-screen" style="display:none;">
        <i class="fa-solid fa-shield-halved" style="font-size: 58px; color: var(--wa-green); margin-bottom: 16px;"></i>
        <h2>Konfirmasi OTP WhatsApp</h2>
        <p style="font-size: 13px; color: #8696a0; margin-top: 6px;">Kode verifikasi simulasi: <b style="color:var(--wa-green);">8888</b></p>
        <input type="text" id="inputOtp" class="form-input" placeholder="4 digit OTP" maxlength="4" style="letter-spacing: 4px; font-weight: bold;">
        <button class="btn-green" onclick="verifyOtpCode()">Verifikasi & Masuk</button>
    </div>

    <!-- MAIN APP -->
    <div class="app-window" id="appWindowContainer">
        <div id="viewContactList" class="view-panel active">
            <div class="app-header">
                <div class="header-title" style="cursor:pointer;" onclick="openProfileSettings()"><i class="fa-solid fa-user-gear"></i> <span id="headerMyName">iqChat</span></div>
                <div class="header-actions">
                    <button id="btnInstall" class="btn-pwa-install" onclick="triggerPwaInstall()"><i class="fa-solid fa-download"></i> Install</button>
                    <button class="btn-logout" onclick="logoutSession()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
                </div>
            </div>
            
            <div style="background:#115e59; color:white; padding:6px 14px; font-size:11px; display:flex; justify-content:space-between; align-items:center;">
                <span>Akun: <b id="myPhoneBadge">-</b></span>
                <span id="connectionStatusBadge" style="color:#a7f3d0;">Cloud & Offline Ready</span>
            </div>

            <div class="search-bar-container">
                <input type="text" class="search-box" placeholder="Cari kontak atau riwayat pesan..." oninput="filterContacts(this.value)">
                <button onclick="addNewContactPrompt()" class="btn-icon" style="background:var(--wa-dark-green); color:white; width:36px; height:36px; border-radius:50%; font-size:14px;" title="Tambah Kontak"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <div class="contact-list" id="contactListContainer"></div>
        </div>

        <!-- CHAT ROOM -->
        <div id="viewChatRoom" class="view-panel chat-room-panel">
            <div class="app-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="backToContactList()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 14px;">T</div>
                    <div>
                        <div id="activeName" style="font-weight: bold; font-size: 14px;">Kontak</div>
                        <div style="font-size: 10.5px; color: #dcf8c6; display:flex; align-items:center; gap:6px;">
                            <span>Nada:</span>
                            <select id="contactToneSelect" onchange="updateContactTone(this.value)" style="background:transparent; color:#dcf8c6; border:none; font-size:10.5px; outline:none; cursor:pointer;">
                                <option value="standard" style="color:#000;">Standar (Beep)</option>
                                <option value="double" style="color:#000;">Ganda (Double)</option>
                                <option value="custom" style="color:#000;">Audio File Kustom</option>
                                <option value="silent" style="color:#000;">Senyap (Mute)</option>
                            </select>
                            <input type="file" id="customAudioFile" accept="audio/*" style="display:none;" onchange="uploadCustomAudio(this)">
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" onclick="editContactProfile()" title="Simpan / Edit Kontak" style="color:white;"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="btn-icon" onclick="startVoiceCall()" style="color:white;"><i class="fa-solid fa-phone"></i></button>
                    <button class="btn-icon" onclick="startVideoCall()" style="color:white;"><i class="fa-solid fa-video"></i></button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessagesArea"></div>

            <div class="chat-input-area">
                <input type="file" id="fileInput" style="display:none" onchange="handleFileSelected(this)">
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="messageInput" class="chat-input-box" placeholder="Ketik pesan..." onfocus="scrollToBottomChat()" onkeypress="handleKeyPress(event)">
                <button onclick="sendChatMessage()" style="background:var(--wa-green); border:none; width:42px; height:42px; border-radius:50%; color:#111; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- AUDIO KUSTOM -->
    <audio id="customRingtoneAudio" style="display:none;"></audio>
    <audio id="callRingtoneAudio" loop style="display:none;"></audio>

    <script>
        const firebaseConfig = {
            databaseURL: "https://iqbike-1-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentUser = localStorage.getItem('iq_user_phone') || "";
        let activeTarget = localStorage.getItem('iq_active_target') || "";
        let contacts = JSON.parse(localStorage.getItem('iq_contacts') || '["628997032209", "6285934602965"]');
        let localStream = null;
        let remoteStream = null;
        let pendingPopupTarget = null;
        let activeCallRef = null;
        let peerConnection = null;
        let isSwapped = false;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstall').style.display = 'inline-flex';
        });

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA installed successfully');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert("Aplikasi sudah terinstal atau gunakan menu 'Tambahkan ke Layar Utama' di titik tiga Chrome.");
            }
        }

        function requestOtpCode() {
            const phone = document.getElementById('inputPhone').value.trim();
            if(!phone || phone.length < 10) { alert("Masukkan nomor valid!"); return; }
            localStorage.setItem('temp_phone', phone.replace(/\D/g,''));
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('otpModal').style.display = 'flex';
        }

        function verifyOtpCode() {
            const otp = document.getElementById('inputOtp').value.trim();
            if(otp === "8888") {
                currentUser = localStorage.getItem('temp_phone');
                localStorage.setItem('iq_user_phone', currentUser);
                document.getElementById('otpModal').style.display = 'none';
                initAppSession();
            } else { alert("OTP Salah! Gunakan: 8888"); }
        }

        function logoutSession() {
            if(confirm("Keluar akun?")) { localStorage.removeItem('iq_user_phone'); location.reload(); }
        }

        function initAppSession() {
            document.getElementById('myPhoneBadge').innerText = "+" + currentUser;
            let profiles = JSON.parse(localStorage.getItem('iq_profiles') || '{}');
            document.getElementById('headerMyName').innerText = profiles[currentUser]?.name || ("+" + currentUser);
            
            renderContactList();
            setupGlobalListeners();
            setupDraggableChatHead();
            listenToIncomingCalls();
        }

        function openProfileSettings() {
            let profiles = JSON.parse(localStorage.getItem('iq_profiles') || '{}');
            let currentName = profiles[currentUser]?.name || currentUser;
            let newName = prompt("Atur Nama Profil Anda:", currentName);
            if(newName) {
                if(!profiles[currentUser]) profiles[currentUser] = {};
                profiles[currentUser].name = newName;
                localStorage.setItem('iq_profiles', JSON.stringify(profiles));
                document.getElementById('headerMyName').innerText = newName;
            }
        }

        function editContactProfile() {
            let contactDetails = JSON.parse(localStorage.getItem('iq_contact_details') || '{}');
            let current = contactDetails[activeTarget] || {};
            let newName = prompt("Simpan Nama Kontak:", current.name || ("+" + activeTarget));
            if(newName !== null) {
                let newPhoto = prompt("URL Foto Profil / Avatar (Opsional):", current.photo || "");
                contactDetails[activeTarget] = { name: newName, photo: newPhoto };
                localStorage.setItem('iq_contact_details', JSON.stringify(contactDetails));
                openChatRoom(activeTarget);
                renderContactList();
            }
        }

        function renderContactList(filter = "") {
            const container = document.getElementById('contactListContainer');
            container.innerHTML = "";
            let contactDetails = JSON.parse(localStorage.getItem('iq_contact_details') || '{}');

            contacts.filter(n => n.includes(filter)).forEach(num => {
                const roomKey = [currentUser.replace(/\D/g,''), num.replace(/\D/g,'')].sort().join('_');
                let allMsgs = JSON.parse(localStorage.getItem('iq_msgs_history_' + roomKey) || '[]');
                let lastMsg = allMsgs.length > 0 ? allMsgs[allMsgs.length - 1].content : "Ketuk untuk mulai percakapan (Offline Ready)";
                if(typeof lastMsg === 'object') lastMsg = "[Media/File]";

                let details = contactDetails[num] || {};
                let displayName = details.name || ("+" + num);
                let avatarStyle = details.photo ? `background-image: url('${details.photo}');` : '';
                let avatarText = details.photo ? '' : num.slice(-2);

                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => openChatRoom(num);
                
                let pressTimer;
                div.onmousedown = div.ontouchstart = () => {
                    pressTimer = setTimeout(() => {
                        if(confirm(`Hapus riwayat pesan / kontak +${num}?`)) {
                            localStorage.removeItem('iq_msgs_history_' + roomKey);
                            db.ref('iqchat_rooms_live/' + roomKey).remove();
                            renderContactList();
                        }
                    }, 800);
                };
                div.onmouseup = div.onmouseleave = div.ontouchend = () => clearTimeout(pressTimer);

                div.innerHTML = `
                    <div class="avatar" style="${avatarStyle}">${avatarText}</div>
                    <div class="contact-info">
                        <div class="contact-name"><span>${displayName}</span> <span style="font-size:10px; color:#8696a0;">${allMsgs.length > 0 ? allMsgs[allMsgs.length-1].time : ''}</span></div>
                        <div class="contact-preview">${lastMsg}</div>
                    </div>
                    ${allMsgs.length > 0 ? '<div class="unread-badge">●</div>' : ''}
                `;
                container.appendChild(div);
            });
        }

        function filterContacts(val) { renderContactList(val.trim()); }

        function addNewContactPrompt() {
            let num = prompt("Masukkan Nomor WhatsApp Tujuan (628...):");
            if(num) {
                num = num.replace(/\D/g,'');
                if(!contacts.includes(num)) { contacts.push(num); localStorage.setItem('iq_contacts', JSON.stringify(contacts)); }
                openChatRoom(num);
            }
        }

        function openChatRoom(num) {
            activeTarget = num;
            localStorage.setItem('iq_active_target', activeTarget);
            
            let contactDetails = JSON.parse(localStorage.getItem('iq_contact_details') || '{}');
            let details = contactDetails[num] || {};
            document.getElementById('activeName').innerText = details.name || ("+" + num);
            
            let avatarEl = document.getElementById('activeAvatar');
            if(details.photo) {
                avatarEl.style.backgroundImage = `url('${details.photo}')`;
                avatarEl.innerText = '';
            } else {
                avatarEl.style.backgroundImage = '';
                avatarEl.innerText = num.slice(-2);
            }

            let tones = JSON.parse(localStorage.getItem('iq_tones') || '{}');
            document.getElementById('contactToneSelect').value = tones[activeTarget] || 'standard';

            document.getElementById('viewContactList').classList.remove('active');
            document.getElementById('viewChatRoom').classList.add('active');
            
            document.getElementById('chatHead').style.display = 'none';
            document.getElementById('chatHeadUnread').style.display = 'none';
            loadAndListenMessages();
        }

        function updateContactTone(toneVal) {
            if(toneVal === 'custom') {
                document.getElementById('customAudioFile').click();
                return;
            }
            let tones = JSON.parse(localStorage.getItem('iq_tones') || '{}');
            tones[activeTarget] = toneVal;
            localStorage.setItem('iq_tones', JSON.stringify(tones));
        }

        function uploadCustomAudio(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    let customAudios = JSON.parse(localStorage.getItem('iq_custom_audios') || '{}');
                    customAudios[activeTarget] = e.target.result;
                    localStorage.setItem('iq_custom_audios', JSON.stringify(customAudios));

                    let tones = JSON.parse(localStorage.getItem('iq_tones') || '{}');
                    tones[activeTarget] = 'custom';
                    localStorage.setItem('iq_tones', JSON.stringify(tones));
                    alert("Audio nada dering kustom berhasil disimpan!");
                };
                reader.readAsDataURL(file);
            }
        }

        function backToContactList() {
            document.getElementById('viewChatRoom').classList.remove('active');
            document.getElementById('viewContactList').classList.add('active');
            renderContactList();

            if(activeTarget) {
                showChatHeadBubble(activeTarget);
            }
        }

        function setupDraggableChatHead() {
            const head = document.getElementById('chatHead');
            const dropX = document.getElementById('dropZoneX');
            let isDragging = false;
            let startX, startY, initialX, initialY;

            head.onmousedown = head.ontouchstart = (e) => {
                isDragging = true;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX;
                startY = clientY;
                let rect = head.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                dropX.style.display = 'flex';
            };

            window.onmousemove = window.ontouchmove = (e) => {
                if (!isDragging) return;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let dx = clientX - startX;
                let dy = clientY - startY;

                head.style.left = (initialX + dx) + 'px';
                head.style.top = (initialY + dy) + 'px';
                head.style.right = 'auto';
                head.style.bottom = 'auto';

                let dropRect = dropX.getBoundingClientRect();
                let headRect = head.getBoundingClientRect();
                if(headRect.left < dropRect.right && headRect.right > dropRect.left && headRect.top < dropRect.bottom && headRect.bottom > dropRect.top) {
                    dropX.style.background = 'red';
                } else {
                    dropX.style.background = 'rgba(0,0,0,0.7)';
                }
            };

            window.onmouseup = window.ontouchend = () => {
                if (!isDragging) return;
                isDragging = false;
                dropX.style.display = 'none';

                let dropRect = dropX.getBoundingClientRect();
                let headRect = head.getBoundingClientRect();
                if(headRect.left < dropRect.right && headRect.right > dropRect.left && headRect.top < dropRect.bottom && headRect.bottom > dropRect.top) {
                    head.style.display = 'none';
                } else {
                    if(Math.abs(headRect.left - initialX) < 5 && Math.abs(headRect.top - initialY) < 5) {
                        if(pendingPopupTarget) {
                            openChatRoom(pendingPopupTarget);
                            document.getElementById('appWindowContainer').style.display = 'flex';
                            head.style.display = 'none';
                            document.getElementById('chatHeadUnread').style.display = 'none';
                        }
                    }
                }
            };
        }

        function showChatHeadBubble(num) {
            pendingPopupTarget = num;
            let contactDetails = JSON.parse(localStorage.getItem('iq_contact_details') || '{}');
            let details = contactDetails[num] || {};
            let head = document.getElementById('chatHead');

            if(details.photo) {
                head.style.backgroundImage = `url('${details.photo}')`;
                head.innerHTML = '<div id="chatHeadUnread" class="chat-head-unread" style="display:block;"></div>';
            } else {
                head.style.backgroundImage = 'none';
                head.innerHTML = `<i class="fa-solid fa-comments"></i><div id="chatHeadUnread" class="chat-head-unread" style="display:block;"></div>`;
            }
            head.style.display = 'flex';
        }

        function playCustomNotification(targetNum, senderName, messageText) {
            let tones = JSON.parse(localStorage.getItem('iq_tones') || '{}');
            let preference = tones[targetNum] || 'standard';
            if(preference === 'silent') return;

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}

            if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); }

            showIncomingPopup(targetNum, senderName, messageText);
            showChatHeadBubble(targetNum);
        }

        function showIncomingPopup(num, name, text) {
            pendingPopupTarget = num;
            let contactDetails = JSON.parse(localStorage.getItem('iq_contact_details') || '{}');
            let details = contactDetails[num] || {};

            let avEl = document.getElementById('popupAvatar');
            if(details.photo) {
                avEl.style.backgroundImage = `url('${details.photo}')`;
                avEl.innerText = '';
            } else {
                avEl.style.backgroundImage = '';
                avEl.innerText = num.slice(-2);
            }

            document.getElementById('popupSenderName').innerText = details.name || ("+" + num);
            document.getElementById('popupMessageText').innerText = typeof text === 'object' ? '[Kirim Berkas/Media]' : text;
            document.getElementById('incomingPopup').style.display = 'flex';

            setTimeout(() => {
                document.getElementById('incomingPopup').style.display = 'none';
            }, 6000);
        }

        function openChatFromPopup() {
            document.getElementById('incomingPopup').style.display = 'none';
            document.getElementById('chatHead').style.display = 'none';
            if(pendingPopupTarget) {
                openChatRoom(pendingPopupTarget);
                document.getElementById('appWindowContainer').style.display = 'flex';
            }
        }

        function scrollToBottomChat() {
            const area = document.getElementById('chatMessagesArea');
            setTimeout(() => { area.scrollTop = area.scrollHeight; }, 250);
        }

        function sendChatMessage(customContent = null, type = 'text') {
            const input = document.getElementById('messageInput');
            const content = customContent || input.value.trim();
            if(!content || !activeTarget) return;

            const roomKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
            const msgObj = {
                sender: currentUser,
                content: content,
                type: type,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };

            let localMsgs = JSON.parse(localStorage.getItem('iq_msgs_history_' + roomKey) || '[]');
            localMsgs.push(msgObj);
            localStorage.setItem('iq_msgs_history_' + roomKey, JSON.stringify(localMsgs));
            renderChatUI(localMsgs);

            db.ref('iqchat_rooms_live/' + roomKey).push(msgObj, (error) => {
                if(error) { console.log("Offline mode active"); }
            });

            if(!customContent) input.value = "";
        }

        function handleFileSelected(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const fileData = { name: file.name, data: e.target.result, size: (file.size / 1024).toFixed(1) + ' KB' };
                    if(file.type.startsWith('image/')) {
                        sendChatMessage(fileData, 'image');
                    } else {
                        sendChatMessage(fileData, 'file');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function setupGlobalListeners() {
            contacts.forEach(num => {
                const roomKey = [currentUser.replace(/\D/g,''), num.replace(/\D/g,'')].sort().join('_');
                
                let cached = JSON.parse(localStorage.getItem('iq_msgs_history_' + roomKey) || '[]');
                if(cached.length > 0 && activeTarget === num) {
                    renderChatUI(cached);
                }

                db.ref('iqchat_rooms_live/' + roomKey).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        let messages = Object.values(data);
                        localStorage.setItem('iq_msgs_history_' + roomKey, JSON.stringify(messages));
                        
                        let countKey = 'count_' + roomKey;
                        let prevCount = parseInt(localStorage.getItem(countKey) || messages.length);
                        
                        if (messages.length > prevCount) {
                            const latest = messages[messages.length - 1];
                            if (latest.sender !== currentUser) {
                                playCustomNotification(num, num, latest.content);
                            }
                        }
                        localStorage.setItem(countKey, messages.length);

                        if(activeTarget === num) {
                            renderChatUI(messages);
                        }
                        renderContactList();
                    }
                });
            });
        }

        function loadAndListenMessages() {
            if(!activeTarget) return;
            const roomKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
            let localMsgs = JSON.parse(localStorage.getItem('iq_msgs_history_' + roomKey) || '[]');
            renderChatUI(localMsgs);
        }

        function renderChatUI(messages) {
            const area = document.getElementById('chatMessagesArea');
            area.innerHTML = "";
            
            messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const bubble = document.createElement('div');
                bubble.className = `bubble ${isMe ? 'outgoing' : 'incoming'}`;
                
                let bodyHtml = "";
                if(msg.type === 'image') {
                    bodyHtml = `<img src="${msg.content.data}" style="max-width:100%; border-radius:6px; margin-bottom:4px;"><div style="font-size:11px;">📷 ${msg.content.name} (${msg.content.size})</div>`;
                } else if(msg.type === 'file') {
                    bodyHtml = `<div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.05); padding:8px; border-radius:6px;"><i class="fa-solid fa-file-pdf" style="font-size:24px; color:#c5221f;"></i><div style="overflow:hidden;"><div style="font-weight:bold; font-size:12px; white-space:nowrap; text-overflow:ellipsis;">${msg.content.name}</div><div style="font-size:10px; color:#666;">${msg.content.size}</div></div></div>`;
                } else {
                    bodyHtml = `<div>${msg.content}</div>`;
                }

                bubble.innerHTML = `${bodyHtml}<div class="bubble-meta">${msg.time} ${isMe ? '<i class="fa-solid fa-check-double" style="color:#53bdeb;"></i>' : ''}</div>`;
                area.appendChild(bubble);
            });
            area.scrollTop = area.scrollHeight;
        }

        function playCallRingtone() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                window._callOsc = audioCtx.createOscillator();
                window._callGain = audioCtx.createGain();
                window._callOsc.type = 'triangle';
                window._callOsc.frequency.setValueAtTime(440, audioCtx.currentTime);
                window._callGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                window._callOsc.connect(window._callGain);
                window._callGain.connect(audioCtx.destination);
                window._callOsc.start();
            } catch(e) {}
            if(navigator.vibrate) { navigator.vibrate([500, 500, 500, 500]); }
        }

        function stopCallRingtone() {
            if(window._callOsc) { try { window._callOsc.stop(); } catch(e) {} }
            if(navigator.vibrate) { navigator.vibrate(0); }
        }

        function startVideoCall() {
            if(!activeTarget) return;
            const callKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
            activeCallRef = db.ref('iqchat_calls/' + callKey);

            activeCallRef.set({ caller: currentUser, status: 'calling', timestamp: Date.now() });

            document.getElementById('videoCallModal').style.display = 'flex';
            document.getElementById('videoCallTitle').innerText = `Memanggil +${activeTarget}...`;
            document.getElementById('videoCallStatus').innerText = "Menunggu jawaban...";
            document.getElementById('btnAnswerCall').style.display = 'none';

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('localVideo').srcObject = stream;
                    setupPeerConnection();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                }).catch(e => alert("Gagal akses kamera/mic"));

            activeCallRef.on('value', (snapshot) => {
                let callData = snapshot.val();
                if(callData && callData.status === 'accepted') {
                    document.getElementById('videoCallStatus').innerText = "Terhubung (Full Screen)";
                    stopCallRingtone();
                } else if(!callData || callData.status === 'ended') {
                    endVideoCall();
                }
            });
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
            };
            peerConnection.onicecandidate = (event) => {
                if(event.candidate) {
                    const callKey = [currentUser.replace(/\D/g,''), activeTarget.replace(/\D/g,'')].sort().join('_');
                    db.ref('iqchat_calls/' + callKey + '/candidates').push(JSON.stringify(event.candidate));
                }
            };
        }

        function switchVideoView() {
            isSwapped = !isSwapped;
            let localVid = document.getElementById('localVideo');
            let remoteVid = document.getElementById('remoteVideo');
            let temp = localVid.srcObject;
            localVid.srcObject = remoteVid.srcObject;
            remoteVid.srcObject = temp;
        }

        function listenToIncomingCalls() {
            contacts.forEach(num => {
                const callKey = [currentUser.replace(/\D/g,''), num.replace(/\D/g,'')].sort().join('_');
                db.ref('iqchat_calls/' + callKey).on('value', (snapshot) => {
                    let callData = snapshot.val();
                    if(callData && callData.caller !== currentUser && callData.status === 'calling') {
                        activeCallRef = db.ref('iqchat_calls/' + callKey);
                        document.getElementById('videoCallModal').style.display = 'flex';
                        document.getElementById('videoCallTitle').innerText = `Panggilan dari +${callData.caller}`;
                        document.getElementById('videoCallStatus').innerText = "Panggilan masuk...";
                        document.getElementById('btnAnswerCall').style.display = 'block';

                        playCallRingtone();

                        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                            .then(stream => {
                                localStream = stream;
                                document.getElementById('localVideo').srcObject = stream;
                            }).catch(e => {});
                    }
                });
            });
        }

        function answerIncomingCall() {
            if(activeCallRef) {
                activeCallRef.update({ status: 'accepted' });
                document.getElementById('videoCallStatus').innerText = "Terhubung (Full Screen)";
                document.getElementById('btnAnswerCall').style.display = 'none';
                stopCallRingtone();

                setupPeerConnection();
                if(localStream) {
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                }
            }
        }

        function startVoiceCall() { alert(`Memulai Panggilan Suara dengan +${activeTarget}`); }

        function endVideoCall() {
            stopCallRingtone();
            if(activeCallRef) { activeCallRef.update({ status: 'ended' }); }
            if(localStream) { localStream.getTracks().forEach(track => track.stop()); }
            if(peerConnection) { peerConnection.close(); }
            document.getElementById('videoCallModal').style.display = 'none';
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendChatMessage(); }

        window.onload = function() {
            if(!currentUser) { 
                document.getElementById('loginModal').style.display = 'flex'; 
                document.getElementById('chatHead').style.display = 'none';
            } else { 
                document.getElementById('loginModal').style.display = 'none'; 
                initAppSession(); 
                listenToIncomingCalls();
            }
        }
    </script>
</body>
</html>
