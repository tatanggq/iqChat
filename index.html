<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iqMessenger - Offline & Cloud Hybrid Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --wa-green: #25D366;
            --wa-dark-green: #075E54;
            --wa-bg: #ece5dd;
            --bubble-incoming: #ffffff;
            --bubble-outgoing: #dcf8c6;
            --text-dark: #303030;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .app-header { background: var(--wa-dark-green); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .chat-area { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 13px; position: relative; word-break: break-word; }
        .incoming { background: var(--bubble-incoming); align-self: flex-start; border-top-left-radius: 0; }
        .outgoing { background: var(--bubble-outgoing); align-self: flex-end; border-top-right-radius: 0; }
        .chat-input-bar { background: #f0f0f0; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
        .chat-input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; outline: none; font-size: 13px; background: #fff; }
        .btn-send { background: var(--wa-green); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .login-overlay { position: absolute; inset: 0; background: #121212; color: white; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .form-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; margin-top: 8px; outline: none; text-align: center; }
        .btn-main { width: 100%; padding: 12px; background: var(--wa-green); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginModal" class="login-overlay">
        <i class="fa-brands fa-whatsapp" style="font-size: 56px; color: var(--wa-green); margin-bottom: 12px;"></i>
        <h2>Masuk iqMessenger</h2>
        <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Gunakan nomor WhatsApp aktif untuk identitas akun Anda</p>
        <input type="tel" id="userPhoneInput" class="form-input" placeholder="08xxxxxxxxxx">
        <button class="btn-main" onclick="registerUserWhatsApp()">Lanjut dengan WhatsApp</button>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-comments" style="font-size: 20px; color: var(--wa-green);"></i>
                <span style="font-weight: bold; font-size: 16px;">iqMessenger (Offline Ready)</span>
            </div>
            <div id="connectionStatus" style="font-size: 10px; background: #27ae60; padding: 3px 8px; border-radius: 10px;">ONLINE</div>
        </header>

        <div id="chatMessages" class="chat-area">
            <div class="message-bubble incoming">
                Halo! Selamat datang di iqMessenger. Aplikasi siap digunakan untuk kirim pesan, foto, dan suara meskipun tanpa kuota (P2P Local Mode).
            </div>
        </div>

        <div class="chat-input-bar">
            <button style="background:none; border:none; color:#555; font-size:18px; cursor:pointer;"><i class="fa-solid fa-paperclip"></i></button>
            <input type="text" id="messageInput" class="chat-input" placeholder="Ketik pesan...">
            <button class="btn-send" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        function registerUserWhatsApp() {
            const phone = document.getElementById('userPhoneInput').value.trim();
            if (!phone || phone.length < 10) {
                alert("Masukkan nomor WhatsApp yang valid!");
                return;
            }
            localStorage.setItem('iq_messenger_phone', phone);
            document.getElementById('loginModal').style.display = 'none';
        }

        function sendTextMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chatArea = document.getElementById('chatMessages');
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble outgoing';
            bubble.innerText = text;
            chatArea.appendChild(bubble);
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        window.onload = function() {
            const savedPhone = localStorage.getItem('iq_messenger_phone');
            if (savedPhone) {
                document.getElementById('loginModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
